name: Build firmware
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 boards and the libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ArduinoJson FastLED NimBLE-Arduino U8g2
      - name: Compile the main board (ESP32-S3)
        run: arduino-cli compile --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=default" --output-dir out/s3 macropad_s3
      - name: Compile the stick (ESP32-C6)
        run: arduino-cli compile --fqbn "esp32:esp32:esp32c6:CDCOnBoot=cdc" --output-dir out/c6 joystick_c6
      - name: Compile the hiiiii test (ESP32-S3)
        run: arduino-cli compile --fqbn "esp32:esp32:esp32s3" --output-dir out/hi hiiiii_s3
      - name: Put the update files on the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p files
          cp out/s3/macropad_s3.ino.bin files/macropad_s3.ino.bin
          cp out/c6/joystick_c6.ino.bin files/joystick_c6.ino.bin
          cp out/hi/hiiiii_s3.ino.bin files/hiiiii_s3.ino.bin
          if [ -f out/hi/hiiiii_s3.ino.merged.bin ]; then cp out/hi/hiiiii_s3.ino.merged.bin files/hiiiii_s3.ino.merged.bin; fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest files/*.bin --title "Latest firmware" --notes "Built from ${GITHUB_SHA::7}. In the pad's setup page: macropad_s3.ino.bin goes in the main board area, joystick_c6.ino.bin in the stick area. hiiiii_s3 files are for the USB flasher card."
